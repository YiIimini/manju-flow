# manju-flow bundle patch: inserts the manju-flow plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with `dsh plugin --profile web add <npm-or-link>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (21 manju_* tools + manjuConsole Remote service), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI.
- insert:
    - id: manju-flow
      name: 'manju-flow'
